name: Publish NuGet

on:
  push:
    tags:
      - 'v*'    # e.g., v1.2.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to request the OIDC token for Trusted Publishing

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore flap.slnx

      - name: Build
        run: dotnet build flap.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution flap.slnx --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Flap/Flap.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      # Exchanges the job's OIDC token for a short-lived (1 hour) nuget.org API key.
      # Requires a Trusted Publishing policy on nuget.org for this repo + exact workflow file name.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), NOT your email address

      - name: Publish to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
